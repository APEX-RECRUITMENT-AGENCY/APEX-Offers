<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مواعيد الانترفيو - Apex</title><meta name="theme-color" content="#d91616"><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0a0a0b;--card:#141416;--tx:#f2f2f3;--mu:#a5a5ab;--acc:#d91616;--bd:#2a2a2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:20px 14px 40px}
.w{max-width:560px;margin:0 auto}
header{text-align:center;border-bottom:2px solid var(--acc);padding-bottom:14px;margin-bottom:14px}
header img{width:72px;height:72px;border-radius:18px;border:1px solid var(--bd)}
h1{margin:8px 0 2px;font-size:22px}header p{margin:0;color:var(--mu);font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:6px}
h2{font-size:15px;color:#ff6b6b;margin:18px 0 8px}
.r{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.n{font-weight:700}.j{color:var(--mu);font-size:13px}
.t{background:linear-gradient(180deg,#f02a2a,#a50f0f);border-radius:10px;padding:4px 12px;font-weight:700;white-space:nowrap;direction:ltr}
.m{text-align:center;color:var(--mu);padding:30px 0}
</style></head><body><div class="w">
<header><img src="icon-192.png" alt="Apex"><h1>مواعيد الانترفيو</h1><p>Apex Recruitment Agency</p></header>
<input id="q" placeholder="ابحث بالاسم..." autocomplete="off">
<div id="l" class="m">جاري التحميل...</div>
</div>
<script src="config.js"></script>
<script>
var all=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var fd=new Intl.DateTimeFormat("ar-EG",{timeZone:"Africa/Cairo",weekday:"long",day:"numeric",month:"long"});
var ft=new Intl.DateTimeFormat("en-US",{timeZone:"Africa/Cairo",hour:"numeric",minute:"2-digit",hour12:true});
var fk=new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo"});
function draw(){
  var q=document.getElementById("q").value.trim().toLowerCase(),el=document.getElementById("l");
  var rows=all.filter(function(r){return!q||String(r.full_name).toLowerCase().indexOf(q)>-1});
  if(!rows.length){el.className="m";el.textContent=all.length?"مفيش نتيجة":"مفيش مواعيد حاليا";return}
  el.className="";var h="",last="";
  rows.forEach(function(r){var d=new Date(r.interview_at),k=fk.format(d);
    if(k!==last){h+="<h2>"+esc(fd.format(d))+"</h2>";last=k}
    h+='<div class="r"><div><div class="n">'+esc(r.full_name)+'</div><div class="j">'+esc([r.job_title,r.job_company].filter(Boolean).join(" - "))+'</div></div><div class="t">'+esc(ft.format(d))+'</div></div>'});
  el.innerHTML=h}
function load(){
  var c=window.APEX_CONFIG;
  fetch(c.SUPABASE_URL+"/rest/v1/rpc/public_interviews",{method:"POST",headers:{apikey:c.SUPABASE_ANON_KEY,Authorization:"Bearer "+c.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:"{}"})
  .then(function(r){return r.json()}).then(function(d){if(!Array.isArray(d))throw 0;all=d;draw()})
  .catch(function(){document.getElementById("l").textContent="تعذر التحميل، جرّب تاني"})}
document.getElementById("q").addEventListener("input",draw);load();setInterval(load,60000);
</script></body></html>
