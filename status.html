<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application Status - Apex</title><meta name="theme-color" content="#d91616"><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0a0a0b;--card:#141416;--ink:#e6e8ea;--mute:#9a9ea3;--line:#2b2d31;--acc:#d91616;--ok:#6fd08c;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.w{max-width:520px;margin:0 auto}
header{text-align:center;margin:8px 0 18px}header img{width:64px;height:64px;border-radius:16px}header h1{font-size:20px;margin:8px 0 0}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:44px;text-align:center;margin:4px 0}.ar{direction:rtl;color:#c9cdd1;margin-top:2px}.mu{color:var(--mute);font-size:14px}
h2{font-size:18px;margin:0 0 6px;text-align:center}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.d{width:100%;color:var(--mute);font-size:13px;margin-top:8px}
button,.b{font:inherit;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.p,.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.sp{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin:8px auto}@keyframes s{to{transform:rotate(360deg)}}
.chat{margin-top:4px}.msgs{display:flex;flex-direction:column;gap:8px;margin:10px 0}.m{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:15px}.m.u{align-self:flex-end;background:var(--acc);color:#fff}.m.a{align-self:flex-start;background:#1e2024;border:1px solid var(--line)}.ask{display:flex;gap:8px}.ask input{flex:1;font:inherit;background:#0f0f11;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.bar{height:8px;background:#26282c;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}input,textarea{width:100%;font:inherit;background:#0f0f11;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}input[readonly]{opacity:.6}.kv{margin:6px 0}.kv b{display:block;color:var(--mute);font-weight:500;font-size:12px}
</style></head><body><div class="w">
<header><img src="icon-192.png" alt="Apex"><h1>Apex Recruitment Agency</h1><p>Application status</p></header>
<div id="app"><div class="sp"></div></div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var C=window.APEX_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
var CHAT=[],BUSY=false,CURS=null,T0=Date.now(),TOK=(new URLSearchParams(location.search).get("t")||"").trim(),POLL=null,CHOSEN=null;
if(!TOK){try{TOK=localStorage.getItem("apexTok")||""}catch(e){}}
var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function B(en,ar){return'<div>'+en+'</div>'}
var TZ="Africa/Cairo";
function fDay(v){return new Date(v).toLocaleDateString("en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"})}
function fTime(v){return new Date(v).toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"})}
function dayKey(v){return new Date(v).toLocaleDateString("en-CA",{timeZone:TZ})}
function show(h){
  var x=CURS&&CURS.decision&&CURS.decision!=="processing"?CURS:null;
  $("app").innerHTML=h+(x&&x.decision==="accepted"?dataHTML(x):"")+(x&&x.feedback?fbHTML(x):"");
  if(x&&x.decision==="accepted"&&$("dsave"))$("dsave").onclick=saveData;
  if(CURS&&(CURS.decision==="accepted"||CURS.decision==="review"))addChat()}
function bar(l,v){v=Math.max(0,Math.min(100,+v||0));return'<div class="kv"><b>'+l+' &middot; '+v+'/100</b><div class="bar"><i style="width:'+v+'%"></i></div></div>'}
function fbHTML(s){
  var f=s.feedback,k=[["fluency","Fluency","Practice speaking for 1 to 2 minutes without stopping. Record yourself and listen back."],["pronunciation","Pronunciation","Listen to native speakers and repeat after them, slowly and clearly."],["grammar","Grammar & vocabulary","Use full sentences and double-check your tenses (I work, I worked, I have worked)."],["clarity","Clarity","Organise your answer: who you are, your experience, and why you want this job."]];
  var low=k[0],h='<div class="card"><h2>Your English voice feedback</h2>'+(f.level?'<div class="kv"><b>Estimated level</b><span style="font-size:22px;font-weight:700">'+esc(f.level)+'</span></div>':'');
  k.forEach(function(x){h+=bar(x[1],f[x[0]]);if((+f[x[0]]||0)<(+f[low[0]]||0))low=x});
  return h+'<div class="mu" style="margin-top:10px">Tip to improve: '+low[2]+'</div></div>'}
var SDT={
 "Alorica":["Date","Full Name","Phone number","Email","Account"],
 "TTC":["Date","Name","Phone Number","Email","Graduation status","Age","Vocaroo Link","Site interview date"],
 "TTEC":["Site interview Date","Name","Phone Number","Email","Vocaroo Link","Age"],
 "TP":["Site date","Full Name","Phone number","ID","Language","E-mail","Graduation statues","Time"],
 "Geeky CX":["Date","Voice note Vocaro in English","Exp message","Full name","Phone number","account name","Email","Graduation Status","Age","Nationality"],
 "Geeky CX Spanish":["Date","Voice note link on Vocaro English / Script","Voice note link on Vocaro Spanish / Script","Introduction in English","Candidate previous Experience (company, title, account, period)","Full name","Phone number","Email","Graduation Status","Age","Nationality"],
 "ACES":["date","Interview Time","Full name","Phone number","Email","Location","English level","Fill out the form? yes or no","Graduation Status","Age","Nationality"],
 "eClerx":["Site date","Full Name","Phone number","Language","E-mail","Nationality","Graduation Status & Major","Time","ID"],
 "CCS":["Site interview date","Name","Phone number","Email","Account","Age","Graduation status","English level","Vocaroo link"],
 "Leadbull":["Date","Interview date","Full name","Phone number","Email","Graduation Status","Age","Nationality"],
 "UCC":["Site interview Date","Name","Phone Number","Email","Vocaroo Link","Age"],
 "LPM":["Interview date","Interview time","Full Name","Title","Phone number","Email","Graduation Status","Age","Nationality"],
 "WGS":["Date","Candidate name","phone number","email","Candidate previous Experience (company, title, account, period)","offer","Vn script link"],
 "Atain":["interview date","name","number","email","lang","Online/onsite","graduation"],
 "Cxperts":["Interview Date","Interview Time","Full name","Phone number","Exp message","Email","English level","Graduation Status","Age","Nationality"],
 "LTS":["Site Date","Name","Phone Number","Email","ID number","Grad status","account"],
 "Minister Fitness Pharma":["Site date","Name","Phone Number","email","time","Position"],
 "Telephonic":["Date","Time","Name","Number","Gmail","language"],
 "Vintrin Clinic":["Site date","Name","Phone Number","email","cv","vacaroo link","time"],
 "Winirix":["Date","Full Name","Phone Number","Email","Graduation Statues","Nationality","Age","CV + Exp message","Introduction in English"],
 "Concentrix":["Date","Name","Phone Number","Email","Account","Graduation status","Age","Vocaroo Link","Site interview date"],
 "Dial Expert":["Date","Name","Phone Number","Email","Graduation status","Age","Vocaroo Link","Exp message","Interview date"],
 "Total Trip Planners":["Date","Name","Phone Number","Email","Graduation status","Age","Vocaroo Link","Interview date"],
 "Crystal Reach":["Date","Name","Phone Number","Email","Graduation status","Age","Vocaroo Link","Interview date"]
};

function sdN(x){return String(x||"").toLowerCase().replace(/[^a-z0-9]+/g,"")}
function sdTab(s){
  var c=sdN(s.company),t=sdN(s.title);
  if(c.indexOf("geekycx")===0||c==="geeky")return t.indexOf("spanish")>=0?"Geeky CX Spanish":"Geeky CX";
  var m={ttc:"TTC",ttec:"TTEC",teleperformance:"TP",tp:"TP",alorica:"Alorica",aces:"ACES",eclerx:"eClerx",contactcentersource:"CCS",ccs:"CCS",leadbull:"Leadbull",ucc:"UCC",lpm:"LPM",winglobalsolutions:"WGS",wgs:"WGS",atain:"Atain",cxperts:"Cxperts",lts:"LTS",ministerfitnesspharma:"Minister Fitness Pharma",telephonic:"Telephonic",vintrinclinic:"Vintrin Clinic",winirix:"Winirix",concentrix:"Concentrix",dialexpert:"Dial Expert",totaltripplanners:"Total Trip Planners",crystalreach:"Crystal Reach"};
  return m[c]||null}
function skipLabel(h){return /^(date|formdate)$/.test(h)||/interviewdate|sitedate|siteinterviewdate/.test(h)||/^(interviewtime|time)$/.test(h)||/spanish|vacaroo|vnscript|vocar|voicenote/.test(h)||/^(account|accountname|title|position|offer|cv|onlineonsite|lang)$/.test(h)||/fillout/.test(h)}
function pre(h,p){
  if(/^(fullname|name|candidatename)$/.test(h))return p.full_name;
  if(/phone|^number$/.test(h))return p.phone;
  if(/email|gmail/.test(h))return p.email;
  if(/^age$/.test(h))return p.age;
  if(/grad/.test(h))return p.graduation;
  if(/englishlevel/.test(h))return p.english_level;
  if(/^language$/.test(h))return p.language;
  if(/location/.test(h))return p.location;
  if(/expmessage|experience|previous/.test(h))return p.experience;
  return""}
function dataHTML(s){
  var tab=sdTab(s);if(!tab||!SDT[tab])return"";
  var p=s.profile||{},sv=s.saved||{},seen={},rows="",rows2="";
  SDT[tab].forEach(function(l){
    var h=sdN(l);if(seen[h]||skipLabel(h))return;seen[h]=1;
    var v=sv[l]!=null?sv[l]:(pre(h,p)||""),ro=/phone|^number$/.test(h)?' readonly':'';
    var nice=/phone|^number$/.test(h)?"Phone number":/^(fullname|name|candidatename)$/.test(h)?"Full name":/email|gmail/.test(h)?"Email":/grad/.test(h)?"Graduation status":/^age$/.test(h)?"Age":/englishlevel/.test(h)?"English level":/nationality/.test(h)?"Nationality":/^id|idnumber/.test(h)?"National ID number":/location/.test(h)?"Your area":/expmessage|experience|previous/.test(h)?"Previous experience (company, title, period)":/introduction/.test(h)?"Short introduction in English":l;
    var big=/expmessage|experience|previous|introduction/.test(h);
    (big?function(z){rows2+=z}:function(z){rows+=z})('<label class="mu" style="display:block;margin-top:10px">'+esc(nice)+'</label>'+(big?'<textarea data-sdl="'+esc(l)+'" rows="3">'+esc(v)+'</textarea>':'<input data-sdl="'+esc(l)+'" value="'+esc(v)+'"'+ro+' autocomplete="off">'))});
  rows+=rows2;
  return'<div class="card"><h2>Complete your details</h2><div class="mu" style="text-align:center">Fill in your information once. Our team will receive it automatically.'+(s.data_sent?' <span style="color:var(--ok)">&#9989; Saved</span>':'')+'</div>'+rows+'<div class="row"><button class="p" id="dsave">'+(s.data_sent?'Update my details':'Save my details')+'</button></div></div>'}
async function saveData(){
  var o={};document.querySelectorAll("[data-sdl]").forEach(function(i){var v=i.value.trim();if(v)o[i.getAttribute("data-sdl")]=v});
  var b=$("dsave");b.disabled=true;
  var r=await sb.rpc("submit_my_data",{p_token:TOK,p_data:o});
  b.disabled=false;
  if(r.error){alert("Could not save. Please try again.");return}
  load()}

function addChat(){
  var d=document.createElement("div");d.className="card chat";d.id="chat";
  d.innerHTML='<h2>Have a question?</h2><div class="mu" style="text-align:center">Ask about the job: pay, shifts, location, requirements.</div><div class="msgs" id="msgs"></div><div class="ask"><input id="q" maxlength="500" placeholder="Type your question" autocomplete="off"><button class="p" id="qs">Send</button></div>';
  $("app").appendChild(d);paintChat();
  $("qs").onclick=sendQ;$("q").onkeydown=function(e){if(e.key==="Enter")sendQ()};
}
function paintChat(){
  var h="";CHAT.forEach(function(m){
    h+='<div class="m '+(m.r==="u"?"u":"a")+'">'+esc(m.t)+'</div>';
    if(m.wa)h+='<div class="m a"><a class="b p" target="_blank" rel="noopener" href="https://wa.me/2'+esc(m.wa)+'?text='+encodeURIComponent(m.wt)+'">Message our team on WhatsApp</a></div>'});
  if(BUSY)h+='<div class="m a">Typing...</div>';
  var el=$("msgs");if(el){el.innerHTML=h;el.scrollTop=el.scrollHeight}
}
async function sendQ(){
  var inp=$("q"),q=inp.value.trim();if(q.length<2||BUSY)return;
  inp.value="";CHAT.push({r:"u",t:q});BUSY=true;paintChat();
  var res=null;
  try{var r=await sb.functions.invoke("ask-apex",{body:{token:TOK,question:q}});res=r.data}catch(e){}
  BUSY=false;
  if(!res||!res.answer)res={answer:"Sorry, I could not answer right now. Please message our team on WhatsApp.",escalate:true,wa:"01115634954"};
  CHAT.push({r:"a",t:res.answer,wa:res.escalate?(res.wa||"01115634954"):null,wt:"Hello, my name is "+(CURS&&CURS.name||"")+". I applied for "+(CURS&&CURS.company||"")+" - "+(CURS&&CURS.title||"")+". My question: "+q});
  paintChat();
}
function offer(s){return esc(s.company||"")+(s.title?" &ndash; "+esc(s.title):"")}
function detailsHTML(s){
  return'<div class="kv"><b>Offer</b>'+offer(s)+'</div>'+(s.location?'<div class="kv"><b>Location</b>'+esc(s.location)+'</div>':'')+(s.maps?'<div class="kv"><b>Google Maps</b><a href="'+esc(s.maps)+'" target="_blank" rel="noopener" style="color:#ff8a80">'+esc(s.maps)+'</a></div>':'');
}
function render(s){
  clearInterval(POLL);POLL=null;CURS=s;
  if(!s){show('<div class="card"><div class="big">&#128683;</div><h2>'+B("Link not found","اللينك غير صحيح")+'</h2><div class="mu" style="text-align:center">'+B("Please use the link you received after applying.","استخدم اللينك اللي ظهرلك بعد التقديم.")+'</div></div>');return}
  var n=esc(s.name||"");
  if(s.decision==="processing"&&Date.now()-T0>180000)s.decision="review";
  if(s.decision==="processing"){
    show('<div class="card"><div class="sp"></div><h2>'+B("Hi "+n+", we are reviewing your voice note","أهلاً "+n+"، بنراجع التسجيل بتاعك")+'</h2><div class="mu" style="text-align:center">'+B("This takes about a minute. Keep this page open.","بياخد حوالي دقيقة. سيب الصفحة مفتوحة.")+'</div></div>');
    POLL=setInterval(load,6000);return}
  if(s.decision==="review"){
    show('<div class="card"><div class="big">&#9203;</div><h2>'+B("Thank you "+n+"!","شكراً يا "+n+"!")+'</h2><div class="mu" style="text-align:center">'+B("Your application is under review by our team. We will contact you on WhatsApp.","طلبك تحت المراجعة عند الفريق، هنتواصل معاك على واتساب.")+'</div></div><div class="card">'+detailsHTML(s)+'</div>');return}
  if(s.decision==="rejected"){
    show('<div class="card"><div class="big">&#128591;</div><h2>'+B("Thank you for applying, "+n,"شكراً لتقديمك يا "+n)+'</h2><div class="mu" style="text-align:center">'+B("Unfortunately your profile is not a match for this offer right now. You are welcome to apply again later or to other offers.","للأسف مستواك مش مناسب للوظيفة دي حالياً. تقدر تقدّم تاني بعد فترة أو على وظايف تانية.")+'</div></div>');return}
  // accepted
  var h='<div class="card"><div class="big">&#127881;</div><h2>'+B("Congratulations "+n+"! You are accepted","مبروك يا "+n+"! تم قبولك")+'</h2></div>';
  if(s.interview_at){
    h+='<div class="card"><h2>'+B("Your interview","ميعاد الإنترفيو")+'</h2><div class="kv"><b>Date</b>'+fDay(s.interview_at)+'</div><div class="kv"><b>Time</b>'+fTime(s.interview_at)+'</div>'+detailsHTML(s);
    if(s.confirmed)h+='<div class="row"><span style="color:var(--ok);font-weight:600">&#9989; '+"Attendance confirmed"+'</span></div>';
    else h+='<div class="row"><button class="p" id="cf">&#9989; Confirm I will attend</button></div>';
    h+='</div>';
    if(!s.confirmed&&s.slots&&s.slots.length)h+='<div class="card"><div class="mu">'+B("Need another time? Pick a new slot:","محتاج ميعاد تاني؟ اختار ميعاد جديد:")+'</div>'+slotsHTML(s.slots)+'</div>';
  }else if(s.has_slots&&s.slots&&s.slots.length){
    h+='<div class="card"><h2>'+B("Choose your interview time","اختار ميعاد الإنترفيو")+'</h2><div class="mu" style="text-align:center">'+B("Times are Cairo time.","المواعيد بتوقيت القاهرة.")+'</div>'+slotsHTML(s.slots)+'<div class="row"><button class="p" id="bk" disabled>Book</button></div></div><div class="card">'+detailsHTML(s)+'</div>';
  }else{
    h+='<div class="card"><div class="mu" style="text-align:center">'+B("The company will contact you to arrange the interview time.","الشركة هتتواصل معاك لتحديد ميعاد الإنترفيو.")+'</div></div><div class="card">'+detailsHTML(s)+'</div>';
  }
  show(h);
  if($("cf"))$("cf").onclick=confirmIt;
  document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){CHOSEN=b.dataset.s;document.querySelectorAll("[data-s]").forEach(function(x){x.className=x===b?"p":""});if($("bk"))$("bk").disabled=false;else bookIt()}});
  if($("bk"))$("bk").onclick=bookIt;
}
function slotsHTML(sl){
  var h="",last="";
  sl.forEach(function(v){var k=dayKey(v);if(k!==last){h+=(last?'</div>':'')+'<div class="d">'+fDay(v)+'</div><div class="slots">';last=k}h+='<button data-s="'+esc(v)+'">'+fTime(v)+'</button>'});
  return h+(last?'</div>':'');
}
async function bookIt(){
  if(!CHOSEN)return;
  if(!confirm("Book "+fDay(CHOSEN)+" at "+fTime(CHOSEN)+"?"))return;
  var r=await sb.rpc("book_slot",{p_token:TOK,p_slot:CHOSEN});
  if(r.error){alert("This time is no longer available, please pick another.");CHOSEN=null;load();return}
  CHOSEN=null;load();
}
async function confirmIt(){
  var r=await sb.rpc("confirm_attendance",{p_token:TOK});
  if(r.error){alert("Could not confirm, try again.");return}
  load();
}
async function load(){
  if(!UUID.test(TOK)){render(null);return}
  try{localStorage.setItem("apexTok",TOK)}catch(e){}
  var r=await sb.rpc("candidate_status",{p_token:TOK});
  if(r.error){show('<div class="card"><div class="mu" style="text-align:center">'+B("Could not load. Please refresh.","مقدرناش نحمّل. حدّث الصفحة.")+'</div></div>');return}
  render(r.data);
}
load();
</script></body></html>
