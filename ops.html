.w{max-width:760px;margin:0 auto}@media(min-width:1000px){.w{max-width:1100px}}
header{text-align:center;border-bottom:2px solid var(--acc);padding-bottom:12px;margin-bottom:14px}

.tab.on{background:rgba(217,22,22,.18);border-color:var(--acc);font-weight:700}

.nm{font-weight:700;font-size:16px}.mu{color:var(--mu);font-size:13px}

pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-family:inherit;font-size:14px}

function X(s){
  if(LANG!=="en"||s==null)return s;
  s=String(s);if(!/[؀-ۿ]/.test(s))return s;
  RX.forEach(function(r){s=s.replace(r[0],r[1])});
  DICT.forEach(function(d){if(s.indexOf(d[0])>-1)s=s.split(d[0]).join(d[1])});
  return s.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632});
}

  var AT=["placeholder","title","aria-label"];
  function fix(n){
    if(n.nodeType===3){if(/[؀-ۿ]/.test(n.nodeValue)){var p=n.parentNode;if(p&&(p.tagName==="TEXTAREA"||p.tagName==="SCRIPT"||p.tagName==="STYLE"))return;var v=X(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}
    if(n.nodeType!==1||n.tagName==="SCRIPT"||n.tagName==="STYLE")return;
    AT.forEach(function(a){if(n.hasAttribute(a)){var v=n.getAttribute(a),w=X(v);if(w!==v)n.setAttribute(a,w)}});
    for(var c=n.firstChild;c;c=c.nextSibling)fix(c);
  }
  var mo=new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==="characterData")fix(m.target);else m.addedNodes.forEach(fix)})});

})();

    S.rem.forEach(function(m){
      var n=(m.app_ids||[]).length;
      h+='<div class="card"><div class="row"><span class="nm">'+esc(m.full_name)+'</span><span class="pill b2">'+esc(ROLE_AR[m.role]||m.role)+'</span></div><div class="mu">اتشال '+fd(m.removed_at)+(m.email?' · '+esc(m.email):'')+' · كان معاه '+n+' مرشح'+(m.restored?' · اترجّعوا':'')+'</div>'+
      (n&&!m.restored?'<div class="mu">اعمله دعوة جديدة الأول، وبعد ما يسجل اختاره هنا:</div><div class="btns"><select data-rmsel="'+m.id+'">'+S.team.map(function(p){return'<option value="'+p.id+'">'+esc(p.full_name)+' ('+esc(ROLE_AR[p.role]||p.role)+')</option>'}).join("")+'</select><button class="b s p" data-rm="'+m.id+'">رجّع مرشحيه ليه</button></div>':'')+'</div>'});
  }
  return h;
}
/* ---------- templates ---------- */
function tpHTML(){
  var h='<div class="card"><div class="mu">المتغيرات اللي تقدر تستخدمها: {name} اسم المرشح، {offer} الأوفر، {time} ميعاد الإنترفيو، {recruiter} اسم الريكروتر.</div></div>';
  S.tpl.forEach(function(t,i){h+='<div class="card"><input data-tt="'+t.id+'" value="'+esc(t.title)+'" style="width:100%;margin-bottom:6px"><textarea data-tb="'+t.id+'">'+esc(t.body)+'</textarea><div class="btns"><button class="b s p" data-ts="'+t.id+'">حفظ</button><button class="b s d" data-td="'+t.id+'">مسح</button></div></div>'});
  return h+'<div class="card"><div class="nm">قالب جديد</div><input id="nt_t" placeholder="العنوان" style="width:100%;margin:6px 0"><textarea id="nt_b" placeholder="نص الرسالة"></textarea><div class="btns"><button class="b s p" data-tn="1">إضافة</button></div></div>';
}
/* ---------- payments ---------- */
function payFlags(c){
  var f=[],today=cairoDay();
  if(c.resigned_at&&c.due_date&&c.resigned_at<c.due_date)f.push(["bad","استقال قبل نهاية الضمان، راجع الكوميشن"]);
  else if(c.resigned_at)f.push(["w","استقال بعد الضمان"]);
  if(!c.client_paid&&!c.resigned_at&&c.due_date){if(c.due_date<today)f.push(["bad","الضمان خلص ولسه مدفعش"]);else if(c.due_date<=addDays(today,7))f.push(["w","الضمان بيخلص خلال أسبوع"])}
  return f;
}
function pyHTML(){
  var all=S.pays,unpaid=0,paid=0,rev=0;
  all.forEach(function(c){if(c.client_amount){if(c.client_paid)paid+=c.client_amount;else if(!c.resigned_at)unpaid+=c.client_amount};if(payFlags(c).some(function(x){return x[0]==="bad"}))rev++});
  var h='<div class="sum"><div class="sc" style="--c:var(--ok)"><small>اتدفع</small><b>'+money(paid)+'</b></div><div class="sc" style="--c:var(--warn)"><small>لسه مستحق</small><b>'+money(unpaid)+'</b></div><div class="sc" style="--c:var(--bad)"><small>محتاج مراجعة</small><b>'+rev+'</b></div></div>'+
  '<div class="chips">'+[["all","الكل"],["unpaid","مش مدفوع"],["rev","محتاج مراجعة"],["paid","مدفوع"]].map(function(x){return'<button class="chip'+(S.payf===x[0]?" on":"")+'" data-pf="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>';
  var list=all.filter(function(c){var bad=payFlags(c).some(function(x){return x[0]==="bad"});return S.payf==="all"||(S.payf==="unpaid"&&!c.client_paid)||(S.payf==="paid"&&c.client_paid)||(S.payf==="rev"&&bad)});
  if(!list.length)return h+'<div class="empty">مفيش نتايج.</div>';
  list.forEach(function(c){
    var fl=payFlags(c);
    h+='<div class="card" data-py="'+c.id+'" style="--c:'+(fl.some(function(x){return x[0]==="bad"})?"var(--bad)":c.client_paid?"var(--ok)":"var(--acc)")+'"><div class="row"><span class="nm">'+esc(c.cand_name)+'</span><span class="mu">'+fd(c.created_at)+'</span></div><div class="mu">'+esc(c.offer_label||"")+' · ريكروتر: '+esc(c.rec_name||"—")+(c.due_date?' · الضمان لحد '+c.due_date:'')+'</div>'+
    fl.map(function(x){return'<div style="margin-top:4px"><span class="pill '+(x[0]==="bad"?"":"w")+'">'+x[1]+'</span></div>'}).join("")+
    '<div class="g2" style="margin-top:8px"><div><label>المبلغ اللي العميل بيدفعه (EGP)</label><input type="number" inputmode="numeric" data-pa value="'+(c.client_amount==null?"":c.client_amount)+'"></div><div><label>تاريخ الاستقالة (لو حصلت)</label><input type="date" data-pr value="'+(c.resigned_at||"")+'"></div></div>'+
    '<div class="ro" style="margin-top:8px"><label><input type="checkbox" data-pp'+(c.client_paid?" checked":"")+'> العميل دفع</label><input type="date" data-pd value="'+(c.client_paid_at||"")+'"></div>'+
    '<input data-pn placeholder="ملاحظة" value="'+esc(c.pay_note||"")+'" style="width:100%;margin-top:8px"><div class="btns"><button class="b s p" data-ps="'+c.id+'">حفظ</button></div></div>'});
  return h;
}
/* ---------- clients ---------- */
function clHTML(){
  if(!S.clients.length)return'<div class="empty">مفيش بيانات.</div>';
  return S.clients.map(function(c){
    return'<div class="card"><div class="row"><span class="nm">'+esc(c.company)+'</span><span class="pill g">تحويل '+c.hire_rate+'%</span></div>'+
    '<div class="fun"><div><small>مرشحين</small><b>'+c.total+'</b></div><div><small>مقبول+</small><b>'+c.accepted+'</b></div><div><small>Hired</small><b style="color:var(--ok)">'+c.hired+'</b></div><div><small>مرفوض</small><b>'+c.rejected+'</b></div><div><small>مش مدفوع</small><b style="color:var(--warn)">'+c.unpaid_count+'</b></div></div>'+
    '<div class="mu" style="margin-top:6px">اتدفع: <b>'+money(c.paid_amount)+'</b> · مستحق: <b>'+money(c.unpaid_amount)+'</b></div></div>'}).join("")+'<p class="mu">الصفحة دي ليك إنت بس (المالك).</p>';
}
/* ---------- backup ---------- */
function lastBk(){try{return localStorage.getItem("apex_last_backup")||""}catch(e){return""}}
function bkHTML(){
  var lb=lastBk(),age=lb?Math.floor((Date.now()-new Date(lb))/864e5):null;
  return'<div class="card" style="--c:'+(age==null||age>7?"var(--bad)":"var(--ok)")+'"><div class="nm">النسخة الاحتياطية</div><div class="mu">'+(lb?'آخر نسخة نزّلتها من هنا: '+fdt(lb)+' (من '+age+' يوم)':'لسه ما نزّلتش نسخة من هنا.')+(age!=null&&age>7?' &#9888;&#65039; عدّى أكتر من أسبوع.':'')+'</div>'+
  '<div class="btns"><button class="b p" data-bk="json">نزّل نسخة كاملة (JSON)</button><button class="b" data-bk="csv">نزّل المرشحين (CSV)</button></div></div>'+
  '<div class="card"><div class="mu">النسخة الكاملة فيها: الأعضاء، المرشحين، الكوميشن، الأسعار، الملاحظات، الأهداف، القوالب، الدعوات. حطها في Google Drive أو على جهازك.<br>عشان النسخ يبقى تلقائي كل يوم، استخدم ملف backup_to_drive.gs المرفق واتبع الخطوات اللي في أوله.</div></div>';
}
function dl(name,text,type){var b=new Blob(["﻿"+text],{type:type||"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function csvCell(v){if(v==null)return"";if(typeof v==="object")v=JSON.stringify(v);v=String(v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function doBackup(kind){
  var r=await sb.rpc("export_backup");if(r.error){toast(r.error.message);return}
  var d=r.data,stamp=cairoDay();
  if(kind==="json")dl("apex-backup-"+stamp+".json",JSON.stringify(d,null,1),"application/json");
  else{
    var rows=d.applications||[],cols=["full_name","phone","email","status","job_company","job_title","recruiter_id","created_at","interview_at","age","english_level","graduation","location","notes"];
    dl("apex-candidates-"+stamp+".csv",[cols.join(",")].concat(rows.map(function(x){return cols.map(function(c){return csvCell(x[c])}).join(",")})).join("\n"),"text/csv;charset=utf-8");
  }
  try{localStorage.setItem("apex_last_backup",new Date().toISOString())}catch(e){}
  toast("اتحمّلت");draw();
}
/* ---------- events ---------- */
document.addEventListener("click",async function(e){
  var b=e.target.closest("button,a");if(!b)return;var d=b.dataset;
  if(d.tab){go(d.tab);return}
  if(d.wa){waFor(d.wa);return}
  if(d.done){
    b.disabled=true;var r=await sb.from("candidate_notes").insert({app_id:d.done,author_id:S.me.id,author_name:S.me.full_name,kind:"call",body:"تم التواصل (من المتابعات)"});
    if(r.error){toast(r.error.message);b.disabled=false;return}
    S.fu=S.fu.filter(function(x){return x.id!==d.done});$("tabs").innerHTML=tabsHTML();draw();toast("تمام");return}
  if(d.snz){
    var days=parseInt(d.d,10),dt=new Date();dt.setDate(dt.getDate()+days);dt.setHours(10,0,0,0);
    var r2=await sb.from("applications").update({followup_at:dt.toISOString()}).eq("id",d.snz);
    if(r2.error){toast(r2.error.message);return}
    S.fu=S.fu.filter(function(x){return x.id!==d.snz});$("tabs").innerHTML=tabsHTML();draw();toast("هفكّرك");return}
  if(d.rg){setRange(d.rg);await go("pf");return}
  if(d.gs){var v=document.querySelector('[data-gt="'+d.gs+'"]').value;if(v===""){toast("اكتب رقم");return}var r3=await sb.rpc("set_goal",{p_user:d.gs,p_month:S.gm+"-01",p_target:parseInt(v,10)});if(r3.error){toast(r3.error.message);return}toast("اتحفظ");await go("gl");return}
  if(d.gx){var r4=await sb.rpc("set_goal",{p_user:d.gx,p_month:S.gm+"-01",p_target:-1});if(r4.error){toast(r4.error.message);return}await go("gl");return}
  if(d.copy==="dy"){var tx=X(dyText(S.daily));try{await navigator.clipboard.writeText(tx);toast("اتنسخ")}catch(x){toast("انسخ من المربع تحت")}return}
  if(d.lf!==undefined&&b.classList.contains("chip")){S.logf=d.lf;draw();return}
  if(d.rs){if(!confirm("استرجاع المرشح ده؟"))return;var r5=await sb.rpc("restore_application",{p_id:d.rs});if(r5.error){toast(r5.error.message);return}toast("اترجّع");await go("tr");return}
  if(d.purge){if(!confirm("مسح نهائي لكل اللي أقدم من ٣٠ يوم؟"))return;var r6=await sb.rpc("purge_trash",{p_days:30});if(r6.error){toast(r6.error.message);return}toast("اتمسح "+r6.data);await go("tr");return}
  if(d.rm){var sel=document.querySelector('[data-rmsel="'+d.rm+'"]');if(!confirm("ترجّع مرشحيه للحساب المختار؟"))return;var r7=await sb.rpc("reassign_removed",{p_removed:d.rm,p_new:sel.value});if(r7.error){toast(r7.error.message);return}toast("اترجّع "+r7.data+" مرشح");await go("tr");return}
  if(d.ts){var t1=document.querySelector('[data-tt="'+d.ts+'"]').value.trim(),b1=document.querySelector('[data-tb="'+d.ts+'"]').value.trim();if(!t1||!b1){toast("اكتب العنوان والنص");return}var r8=await sb.from("msg_templates").update({title:t1,body:b1}).eq("id",d.ts);toast(r8.error?r8.error.message:"اتحفظ");return}
  if(d.td){if(!confirm("مسح القالب؟"))return;var r9=await sb.from("msg_templates").delete().eq("id",d.td);if(r9.error){toast(r9.error.message);return}await go("tp");return}
  if(d.tn){var t2=$("nt_t").value.trim(),b2=$("nt_b").value.trim();if(!t2||!b2){toast("اكتب العنوان والنص");return}var r10=await sb.from("msg_templates").insert({title:t2,body:b2,sort:S.tpl.length+1});if(r10.error){toast(r10.error.message);return}await go("tp");return}
  if(d.pf&&b.classList.contains("chip")){S.payf=d.pf;draw();return}
  if(d.ja){var jr=await sb.rpc("set_team_app_status",{p_id:d.ja,p_status:d.js});if(jr.error){toast(jr.error.message);return}await go("jn");return}
  if(d.qh){var qr=await sb.rpc("mark_question_handled",{p_id:d.qh,p_done:d.qv==="1"});if(qr.error){toast(qr.error.message);return}await go("qs");return}
  if(d.ps){
    var card=document.querySelector('[data-py="'+d.ps+'"]'),amt=card.querySelector("[data-pa]").value,paid=card.querySelector("[data-pp]").checked,pd=card.querySelector("[data-pd]").value,rs=card.querySelector("[data-pr]").value,nt=card.querySelector("[data-pn]").value.trim();
    var upd={client_amount:amt===""?null:parseInt(amt,10),client_paid:paid,client_paid_at:paid?(pd||cairoDay()):null,resigned_at:rs||null,pay_note:nt||null};
    var r11=await sb.from("commissions").update(upd).eq("id",d.ps).select().single();
    if(r11.error){toast(r11.error.message);return}
    var i=S.pays.findIndex(function(x){return x.id===d.ps});if(i>-1)S.pays[i]=r11.data;draw();toast("اتحفظ");return}
  if(d.bk){await doBackup(d.bk);return}
});
document.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="pf_f"||t.id==="pf_t"){S.from=$("pf_f").value;S.to=$("pf_t").value;S.range="";if(S.from&&S.to&&S.from<=S.to)await go("pf");return}
  if(t.id==="gm"&&t.value){S.gm=t.value;await go("gl");return}
  if(t.id==="dy"&&t.value){S.day=t.value;await go("dy");return}
});
boot();
</script></body></html>
