<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Apex | كل الروابط</title>
<meta name="description" content="كل روابط Apex Recruitment Agency في مكان واحد: الوظايف، التقديم كريكروتر، من نحن، وواتساب.">
<meta property="og:title" content="Apex Recruitment Agency">
<meta property="og:description" content="الوظايف، التقديم كريكروتر، وتواصل معانا. كل الروابط هنا.">
<meta property="og:image" content="https://apex-recruitment-agency.github.io/APEX-Offers/icon-512.png">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b0b0d; --surface:#151518; --ink:#f2f3f4; --mute:#a3a7ad; --line:#2a2c31;
  --accent:#e11d1d; --accent-ink:#fff; --glow:rgba(225,29,29,.30);
  --head:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1); color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f6f6f7; --surface:#ffffff; --ink:#16171a; --mute:#5b6067; --line:#dcdde1;
  --accent:#c91414; --glow:rgba(201,20,20,.18); color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  position:relative;overflow-x:hidden}
.orb{position:fixed;width:320px;height:320px;border-radius:50%;background:var(--glow);filter:blur(80px);pointer-events:none;inset-block-start:-120px;inset-inline-end:-100px;animation:float 12s ease-in-out infinite}
.orb.b{inset-block-start:auto;inset-block-end:-120px;inset-inline-end:auto;inset-inline-start:-110px;animation-delay:-6s;opacity:.7}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-26px)}}
main{position:relative;max-width:480px;margin:0 auto}
.top{display:flex;justify-content:flex-end;margin-bottom:6px}
.lang{font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 16px;cursor:pointer}
.lang:hover{border-color:var(--accent)}
.head{text-align:center;padding:14px 0 26px;animation:up .8s var(--ease) both}
.logo{width:96px;height:96px;border-radius:26px;margin:0 auto 16px;display:block;box-shadow:0 12px 40px -10px var(--glow);background:var(--surface)}
h1{font-family:var(--head);font-weight:900;font-size:28px;line-height:1.3;margin:0;letter-spacing:.02em}
.tag{color:var(--mute);margin:8px auto 0;max-width:22em;font-size:16px}
.list{display:grid;gap:12px}
.link{--d:0s;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:up .7s var(--ease) both;animation-delay:var(--d)}
.link:hover,.link:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px -14px var(--glow);outline:none}
.link:active{transform:scale(.98)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t{min-width:0;flex:1}
.t b{display:block;font-family:var(--head);font-weight:700;font-size:17px;line-height:1.35}
.t small{display:block;color:var(--mute);font-size:14px;line-height:1.5}
.go{flex:none;color:var(--mute);transition:transform .25s var(--ease),color .25s}
.go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
[dir=rtl] .go svg{transform:scaleX(-1)}
.link:hover .go{color:var(--accent);transform:translateX(-4px)}
[dir=ltr] .link:hover .go{transform:translateX(4px)}
.link.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link.main .ic{background:rgba(255,255,255,.2);color:#fff}
.link.main .t small,.link.main .go{color:rgba(255,255,255,.85)}
.link.main::after{content:"";position:absolute;inset-block:0;inset-inline-start:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.6s var(--ease) infinite}
@keyframes shine{0%,60%{inset-inline-start:-60%}100%{inset-inline-start:140%}}
.share{margin:22px auto 0;display:flex;justify-content:center}
.share button{font:inherit;font-weight:600;color:var(--mute);background:transparent;border:1px dashed var(--line);border-radius:999px;padding:6px 20px;cursor:pointer;transition:color .2s,border-color .2s}
.share button:hover{color:var(--ink);border-color:var(--accent)}
footer{text-align:center;color:var(--mute);font-size:14px;margin-top:22px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb"></div><div class="orb b"></div>
<main>
  <div class="top"><button class="lang" id="lang" type="button" aria-label="Language">English</button></div>

  <header class="head">
    <img class="logo" src="logo.png" alt="Apex" width="96" height="96" onerror="this.style.display='none'">
    <h1>Apex Recruitment Agency</h1>
    <p class="tag" data-ar="بنوصّل الناس الصح للشغل الصح. القاهرة، مصر." data-en="We connect the right people to the right jobs. Cairo, Egypt.">بنوصّل الناس الصح للشغل الصح. القاهرة، مصر.</p>
  </header>

  <nav class="list" id="list" aria-label="Links"></nav>

  <div class="share"><button type="button" id="share" data-ar="نسخ رابط الصفحة" data-en="Copy this page link">نسخ رابط الصفحة</button></div>
  <footer>© <span id="yr">2026</span> Apex Recruitment Agency</footer>
</main>

<script>
(function(){
  /* ===== عدّل الروابط من هنا. أي رابط url فاضي بيتخبّى لوحده. ===== */
  var LINKS=[
    {main:1, icon:"briefcase", url:"index.html", ar:["شوف الوظايف المتاحة","قدّم من موبايلك في دقايق"], en:["See open jobs","Apply from your phone in minutes"]},
    {icon:"users", url:"join.html", ar:["انضم لينا كريكروتر","اشتغل معانا وخُد كوميشن"], en:["Join us as a recruiter","Work with us and earn commission"]},
    {icon:"check", url:"tools.html", ar:["أدوات مجانية للباحث عن شغل","هل أنا مناسب؟ · اختبار إنجليزي · CV"], en:["Free job-seeker tools","Am I a fit? · English test · CV"]},
    {icon:"info", url:"about.html", ar:["من نحن","اعرف أكتر عن Apex"], en:["About us","Learn more about Apex"]},
    {icon:"book", url:"recruiter-guide.html", ar:["دليل الريكروتر الجديد","كل اللي محتاجه عشان تبدأ"], en:["New recruiter guide","Everything you need to get started"]},
    {icon:"chat", url:"https://wa.me/201115634954", ar:["كلّمنا على واتساب","بنرد في أقرب وقت"], en:["Chat on WhatsApp","We reply as soon as we can"]},
    {icon:"fb", url:"", ar:["صفحتنا على فيسبوك","تابع العروض الجديدة"], en:["Our Facebook page","Follow new offers"]},
    {icon:"in", url:"", ar:["صفحتنا على لينكدإن","تواصل معانا مهنياً"], en:["Our LinkedIn page","Connect with us professionally"]}
  ];
  var ICONS={
    briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
    book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 8h7"/>',
    chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>',
    fb:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8.5A.5.5 0 0 1 14 8Z"/>',
    in:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 11v5M8 8v.01M12 16v-5M12 13a2.5 2.5 0 0 1 5 0v3"/>'
  };
  var ARROW='<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  var d=document,h=d.documentElement,KEY="apexLang",lang="ar";
  try{var s=localStorage.getItem(KEY);if(s==="en"||s==="ar")lang=s}catch(e){}

  var list=d.getElementById('list'),n=0;
  LINKS.forEach(function(L){
    if(!L.url)return;
    var a=d.createElement('a');a.className='link'+(L.main?' main':'');a.href=L.url;a.style.setProperty('--d',(0.15+n*0.08)+'s');n++;
    if(/^https?:/.test(L.url)){a.target='_blank';a.rel='noopener'}
    a.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+ICONS[L.icon]+'</svg></span><span class="t"><b></b><small></small></span><span class="go">'+ARROW+'</span>';
    a._L=L;list.appendChild(a);
  });

  function paint(){
    h.lang=lang;h.dir=lang==="ar"?"rtl":"ltr";
    [].forEach.call(list.children,function(a){var t=a._L[lang];a.querySelector('b').textContent=t[0];a.querySelector('small').textContent=t[1]});
    [].forEach.call(d.querySelectorAll('[data-ar]'),function(el){el.textContent=el.getAttribute('data-'+lang)});
    d.getElementById('lang').textContent=lang==="ar"?"English":"العربية";
    d.title=lang==="ar"?"Apex | كل الروابط":"Apex | All links";
  }
  d.getElementById('lang').addEventListener('click',function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}paint()});

  var sh=d.getElementById('share');
  sh.addEventListener('click',function(){
    var u=location.href;
    function done(){sh.textContent=lang==="ar"?"اتنسخ ✓":"Copied ✓";setTimeout(paint,1800)}
    try{navigator.clipboard.writeText(u).then(done,function(){prompt&&0})}catch(e){}
  });
  d.getElementById('yr').textContent=new Date().getFullYear();
  paint();
})();
</script>
</body>
</html>
