<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>أول يوم شغل | Apex</title>
<meta name="description" content="قايمة عملية لأول يوم وأول أسبوع وأول شهر في الشغل الجديد.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tools.css">
<link rel="canonical" href="https://apex-ra.com/first-day">
<style>.tips li{margin:8px 0;line-height:1.8}.tips ul,.tips ol{padding-inline-start:20px}.art p{line-height:1.95;margin:10px 0}.art h2{font-size:20px;margin:22px 0 6px}.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.ck:last-child{border:0}.ck input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--accent)}.ck.done span{opacity:.55;text-decoration:line-through}</style>
</head>
<body>
<div id="bar"></div>
<main class="wrap">
<div class="ph anim"><div class="eyebrow"  data-ar="نصايح" data-en="Tips">نصايح</div><h1  data-ar="أول يوم شغل: قايمة تطمّنك" data-en="Your first day at work: a checklist">أول يوم شغل: قايمة تطمّنك</h1><p class="lead"  data-ar="علّم على اللي خلّصته. القايمة بتتحفظ على موبايلك بس." data-en="Tick what you have done. The list is saved on your phone only.">علّم على اللي خلّصته. القايمة بتتحفظ على موبايلك بس.</p></div><section class="card  anim" style="margin-top:16px;animation-delay:0.1s"><h2  data-ar="قبل أول يوم" data-en="Before day one">قبل أول يوم</h2><label class="ck" data-k="0-0"><input type="checkbox"><span  data-ar="اتأكد من العنوان والمواصلات وإزاي توصل، وجرّب الطريق قبلها لو تقدر." data-en="Confirm the address and your route; test the trip beforehand if you can.">اتأكد من العنوان والمواصلات وإزاي توصل، وجرّب الطريق قبلها لو تقدر.</span></label><label class="ck" data-k="0-1"><input type="checkbox"><span  data-ar="جهّز الورق المطلوب (بطاقة، شهادة، موقف التجنيد للرجالة، صور)." data-en="Prepare required documents (ID, certificate, military status for men, photos).">جهّز الورق المطلوب (بطاقة، شهادة، موقف التجنيد للرجالة، صور).</span></label><label class="ck" data-k="0-2"><input type="checkbox"><span  data-ar="اسأل عن الدريس كود وميعاد الحضور بالظبط ومين تسأل عليه." data-en="Ask about the dress code, exact arrival time and who to ask for.">اسأل عن الدريس كود وميعاد الحضور بالظبط ومين تسأل عليه.</span></label><label class="ck" data-k="0-3"><input type="checkbox"><span  data-ar="نام بدري، وظبط منبّهين." data-en="Sleep early and set two alarms.">نام بدري، وظبط منبّهين.</span></label><label class="ck" data-k="0-4"><input type="checkbox"><span  data-ar="لو الشغل Remote: جرّب الإنترنت والسماعة والبرامج قبل ميعاد البداية." data-en="If remote: test your internet, headset and software before the start.">لو الشغل Remote: جرّب الإنترنت والسماعة والبرامج قبل ميعاد البداية.</span></label></section><section class="card  anim" style="margin-top:16px;animation-delay:0.15000000000000002s"><h2  data-ar="أول يوم" data-en="Day one">أول يوم</h2><label class="ck" data-k="1-0"><input type="checkbox"><span  data-ar="روح قبل الميعاد بربع ساعة." data-en="Arrive 15 minutes early.">روح قبل الميعاد بربع ساعة.</span></label><label class="ck" data-k="1-1"><input type="checkbox"><span  data-ar="اتعرف على اسم مديرك المباشر والتيم ليدر." data-en="Learn your direct manager and team leader names.">اتعرف على اسم مديرك المباشر والتيم ليدر.</span></label><label class="ck" data-k="1-2"><input type="checkbox"><span  data-ar="اكتب كل حاجة بتتقال في التدريب، وماتتكسفش تسأل." data-en="Take notes in training and do not hesitate to ask.">اكتب كل حاجة بتتقال في التدريب، وماتتكسفش تسأل.</span></label><label class="ck" data-k="1-3"><input type="checkbox"><span  data-ar="اتأكد إنك فاهم ورديتك، وإجازاتك، وإزاي بتتحاسب." data-en="Make sure you understand your shift, days off and how you are paid.">اتأكد إنك فاهم ورديتك، وإجازاتك، وإزاي بتتحاسب.</span></label><label class="ck" data-k="1-4"><input type="checkbox"><span  data-ar="خليك مبتسم ومهتم؛ الانطباع الأول بيفرق." data-en="Stay positive and engaged; first impressions matter.">خليك مبتسم ومهتم؛ الانطباع الأول بيفرق.</span></label></section><section class="card  anim" style="margin-top:16px;animation-delay:0.2s"><h2  data-ar="أول أسبوع" data-en="First week">أول أسبوع</h2><label class="ck" data-k="2-0"><input type="checkbox"><span  data-ar="اسأل عن مقاييس الأداء (KPIs) المطلوبة منك بالأرقام." data-en="Ask what your KPIs are, in numbers.">اسأل عن مقاييس الأداء (KPIs) المطلوبة منك بالأرقام.</span></label><label class="ck" data-k="2-1"><input type="checkbox"><span  data-ar="راجع ملاحظاتك كل يوم 10 دقايق." data-en="Review your notes for 10 minutes each day.">راجع ملاحظاتك كل يوم 10 دقايق.</span></label><label class="ck" data-k="2-2"><input type="checkbox"><span  data-ar="اتعلم السكريبت أو الإجراءات كويس قبل ما تحاول تتطور فيها." data-en="Learn the script/process well before improvising.">اتعلم السكريبت أو الإجراءات كويس قبل ما تحاول تتطور فيها.</span></label><label class="ck" data-k="2-3"><input type="checkbox"><span  data-ar="متغيبش من غير إخبار، حتى لو في ظرف." data-en="Do not miss a day without notice, even in an emergency.">متغيبش من غير إخبار، حتى لو في ظرف.</span></label><label class="ck" data-k="2-4"><input type="checkbox"><span  data-ar="خد رأي مديرك: عامل إيه؟ وإيه اللي أحسنه؟" data-en="Ask your manager how you are doing and what to improve.">خد رأي مديرك: عامل إيه؟ وإيه اللي أحسنه؟</span></label></section><section class="card  anim" style="margin-top:16px;animation-delay:0.25s"><h2  data-ar="أول شهر" data-en="First month">أول شهر</h2><label class="ck" data-k="3-0"><input type="checkbox"><span  data-ar="اعرف نظام التقييم والبونص وإزاي توصل له." data-en="Understand the review and bonus system and how to reach it.">اعرف نظام التقييم والبونص وإزاي توصل له.</span></label><label class="ck" data-k="3-1"><input type="checkbox"><span  data-ar="حافظ على نسبة حضور عالية؛ دي أول حاجة بتتشاف." data-en="Keep attendance high; it is the first thing they check.">حافظ على نسبة حضور عالية؛ دي أول حاجة بتتشاف.</span></label><label class="ck" data-k="3-2"><input type="checkbox"><span  data-ar="اسأل عن فرص الترقية والتدريب." data-en="Ask about promotion and training opportunities.">اسأل عن فرص الترقية والتدريب.</span></label><label class="ck" data-k="3-3"><input type="checkbox"><span  data-ar="لو في مشكلة (مرتب، مواصلات، ورديات)، قولها للمسؤول بدري. ولو الشغل جاي من الايجينسي، كلمنا." data-en="If something is wrong (pay, transport, shifts), raise it early. If the job came through us, contact us.">لو في مشكلة (مرتب، مواصلات، ورديات)، قولها للمسؤول بدري. ولو الشغل جاي من الايجينسي، كلمنا.</span></label></section><section class="card  anim" style="margin-top:16px;animation-delay:0.35s"><h2  data-ar="ينفع كمان" data-en="Also useful">ينفع كمان</h2><div class="row"><a class="btn" href="cv"><span  data-ar="جهّز CV" data-en="Build your CV">جهّز CV</span></a><a class="btn" href="english-test"><span  data-ar="اختبر إنجليزيتك" data-en="English test">اختبر إنجليزيتك</span></a></div></section>
</main>
<script src="tools.js"></script>
<script>
(function(){var A=APEX;
var K='apexFirstDay',st={};try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
document.querySelectorAll('.ck').forEach(function(l){var k=l.dataset.k,i=l.querySelector('input');if(st[k]){i.checked=true;l.classList.add('done')}
i.addEventListener('change',function(){l.classList.toggle('done',i.checked);st[k]=i.checked?1:0;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}})});
A.onLang(function(l){document.title=l==="ar"?"أول يوم شغل | Apex":"First day at work | Apex"});
A.start();})();
</script>
</body>
</html>
