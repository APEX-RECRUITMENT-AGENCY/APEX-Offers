<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>اختبار إنجليزي سريع | Apex</title>
<meta name="description" content="12 سؤال في 3 دقايق تديك فكرة تقريبية عن مستوى إنجليزيك قبل ما تقدّم على وظيفة.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tools.css">
<style>
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:18px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s var(--ease)}
.qn{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.q{font-family:var(--head);font-weight:700;font-size:21px;line-height:1.5;direction:ltr;text-align:left}
.opts{display:grid;gap:10px;margin-top:18px;direction:ltr}
.opt{font:inherit;font-size:17px;text-align:left;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:all .2s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.big{font-family:var(--head);font-weight:900;font-size:68px;line-height:1;color:var(--accent);margin:8px 0}
.res .lv{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.bars{display:grid;gap:8px;margin-top:16px}
.bars div{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;font-size:14px;color:var(--mute);direction:ltr}
.bars i{display:block;height:8px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.bars i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
</style>
</head>
<body>
<div id="bar"></div>
<main class="wrap">
  <div class="ph anim">
    <div class="eyebrow" data-ar="أداة" data-en="Tool">أداة</div>
    <h1 data-ar="اختبار إنجليزي سريع" data-en="Quick English test">اختبار إنجليزي سريع</h1>
    <p class="lead" data-ar="12 سؤال في حوالي 3 دقايق. بيديك فكرة تقريبية عن مستواك، والتقييم الحقيقي بيتم بالفويس لما تقدّم." data-en="12 questions in about 3 minutes. It gives you a rough idea of your level; the real assessment is by voice when you apply.">12 سؤال في حوالي 3 دقايق. بيديك فكرة تقريبية عن مستواك، والتقييم الحقيقي بيتم بالفويس لما تقدّم.</p>
  </div>

  <section class="card anim" id="box" style="margin-top:18px;animation-delay:.1s">
    <div id="start">
      <p data-ar="الأسئلة بتبدأ سهلة وبتصعب. ماتخمّنش لو مش عارف، اختار أقرب إجابة." data-en="Questions start easy and get harder. Pick the closest answer if you are unsure.">الأسئلة بتبدأ سهلة وبتصعب. ماتخمّنش لو مش عارف، اختار أقرب إجابة.</p>
      <button class="btn p" id="go" type="button" style="margin-top:16px"><span data-ar="ابدأ الاختبار" data-en="Start the test">ابدأ الاختبار</span></button>
    </div>
    <div id="quiz" hidden>
      <div class="qn"><span id="qn"></span><span id="qlvl"></span></div>
      <div class="q" id="q"></div>
      <div class="opts" id="opts"></div>
      <div class="prog"><i id="pb"></i></div>
    </div>
    <div id="res" class="res" hidden></div>
  </section>
</main>
<div id="foot"></div>

<script src="tools.js"></script>
<script>
(function(){
  var d=document,A=APEX,$=function(i){return d.getElementById(i)};
  /* [level, question, options, correct index] */
  var Q=[
    ["A2","She ___ to work by bus every day.",["goes","go","going","gone"],0],
    ["A2","I ___ my homework yesterday.",["do","did","done","doing"],1],
    ["A2","There isn't ___ milk in the fridge.",["some","any","a","many"],1],
    ["B1","If it rains tomorrow, we ___ at home.",["stay","will stay","stayed","would stay"],1],
    ["B1","He asked me where ___.",["I lived","did I live","do I live","I am living"],0],
    ["B1","I have lived here ___ 2019.",["for","since","from","during"],1],
    ["B2","By the time we arrived, the film ___.",["already started","had already started","has already started","was already starting"],1],
    ["B2","She suggested ___ a taxi.",["to take","taking","take","took"],1],
    ["B2","I'm sorry for the inconvenience. We will ___ your refund as soon as possible.",["process","procedure","proceed","produce"],0],
    ["C1","Had I known about the delay, I ___ earlier.",["would leave","would have left","will leave","left"],1],
    ["C1","The manager insisted that the report ___ by Friday.",["is submitted","be submitted","was submitted","would submitted"],1],
    ["C1","Not only ___ late, but he also forgot the documents.",["he arrived","did he arrive","he did arrive","arrived he"],1]
  ];
  var i=0,score=0,per={A2:0,B1:0,B2:0,C1:0},locked=false;

  function show(){
    var q=Q[i];locked=false;
    $('qn').textContent=A.t("سؤال ","Question ")+(i+1)+" / "+Q.length;$('qlvl').textContent=q[0];
    $('q').textContent=q[1];
    $('opts').innerHTML=q[2].map(function(o,k){return '<button type="button" class="opt" data-k="'+k+'">'+A.esc(o)+'</button>'}).join('');
    $('pb').style.width=(i/Q.length*100)+'%';
  }
  $('opts').addEventListener('click',function(e){
    var b=e.target.closest('.opt');if(!b||locked)return;locked=true;
    b.classList.add('sel');
    if(+b.dataset.k===Q[i][3]){score++;per[Q[i][0]]++}
    setTimeout(function(){i++;if(i<Q.length)show();else finish()},260);
  });

  function level(){
    /* approximate band from total and from the hardest level passed */
    if(score>=11&&per.C1>=2)return {c:"C1",v:5,ar:"C1 (متقدم)",en:"C1 (advanced)"};
    if(score>=9)return {c:"B2+",v:4.5,ar:"B2+ (فوق المتوسط)",en:"B2+ (upper-intermediate)"};
    if(score>=7)return {c:"B2",v:4,ar:"B2 (فوق المتوسط)",en:"B2 (upper-intermediate)"};
    if(score>=4)return {c:"B1",v:3,ar:"B1 (متوسط)",en:"B1 (intermediate)"};
    return {c:"A2",v:2,ar:"A2 أو أقل (أساسي)",en:"A2 or below (basic)"};
  }
  function finish(){
    $('quiz').hidden=true;var r=level(),res=$('res');res.hidden=false;
    $('pb').style.width="100%";
    var tot={A2:3,B1:3,B2:3,C1:3};
    var bars=Object.keys(tot).map(function(k){return '<div><span>'+k+'</span><i><b style="width:'+(per[k]/tot[k]*100)+'%"></b></i></div>'}).join('');
    res.innerHTML='<div class="lv"><span class="big">'+A.esc(r.c)+'</span><span>'+A.esc(A.t(r.ar,r.en))+'</span></div>'+
      '<p style="margin-top:6px">'+A.t("جاوبت صح على "+score+" من "+Q.length+".","You got "+score+" of "+Q.length+" right.")+'</p>'+
      '<div class="bars">'+bars+'</div>'+
      '<p class="hint" style="margin-top:14px">'+A.t("ده تقدير تقريبي من اختبار قصير للقواعد والمفردات، مش شهادة. التقييم الحقيقي في Apex بيتم بالفويس (نطق وطلاقة).","This is a rough estimate from a short grammar and vocabulary test, not a certificate. The real assessment at Apex is by voice (pronunciation and fluency).")+'</p>'+
      '<div class="row" style="margin-top:16px"><a class="btn p" href="match?lvl='+r.v+'">'+A.t("شوف الوظايف المناسبة لمستواك","See jobs that fit your level")+'</a><button class="btn" id="again" type="button">'+A.t("أعد الاختبار","Retake")+'</button></div>';
    $('again').addEventListener('click',reset);
    try{localStorage.setItem("apexEnglish",JSON.stringify({c:r.c,v:r.v,score:score}))}catch(e){}
  }
  function reset(){i=0;score=0;per={A2:0,B1:0,B2:0,C1:0};$('res').hidden=true;$('quiz').hidden=false;show()}

  $('go').addEventListener('click',function(){$('start').hidden=true;$('quiz').hidden=false;show()});
  A.onLang(function(l){d.title=l==="ar"?"اختبار إنجليزي سريع | Apex":"Quick English test | Apex";if(!$('quiz').hidden&&i<Q.length)show()});
  A.start();
})();
</script>
</body>
</html>
