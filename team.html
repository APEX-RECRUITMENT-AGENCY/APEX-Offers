<style>
:root{--bg:#0a0a0b;--card:#141416;--ink:#e6e8ea;--mute:#9a9ea3;--line:#2b2d31;--acc:#d91616;--acc-ink:#fff;--tag:#232528;--hl:#c4c8cc;--bad:#ff8a80;--ok:#6fd08c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 60px}@media(min-width:1200px){.wrap{max-width:1200px}}
header{display:flex;align-items:center;gap:8px;padding:18px 0}
.brand{font-weight:800;font-size:20px;flex:1}
button,select,input,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
.btn{border:1px solid var(--ink);background:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.logo{height:46px;width:auto;border-radius:10px;border:1px solid var(--line);display:block}
.brandrow{display:flex;align-items:center;gap:12px}
a{color:#c4c8cc}
.btn:hover,.tab:hover,.chip:hover{border-color:var(--acc)}
.btn.pri:hover,.copy:hover,.sm.pri:hover{filter:brightness(1.12)}
.chip.on,.tab.on{border-color:var(--acc)}
.hc{background:#141416;border:1px solid #2a2a2e;border-radius:16px;padding:14px;margin-bottom:12px}.hc .ln{padding:10px 0;border-top:1px solid #2a2a2e}.hc .ln:first-of-type{margin-top:8px}.pill{border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;display:inline-block}.hc .mute,.hc .ln .mute{font-size:13px}.hc .name{font-size:15px}.hc a.btn,.hc .name.lnk,.hc .lnk{text-decoration:none;border-bottom:0;cursor:pointer}.hc .btn.pri{background:#d91616;border-color:#d91616;color:#fff;border-radius:10px}
.card:hover{border-color:var(--acc)}
h1,h2{letter-spacing:.01em}
html{background:var(--bg)}body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -10%,#1d1112 0,transparent 60%) no-repeat,var(--bg)}

.btn.sm{padding:5px 10px;font-size:14px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.box{max-width:420px;margin:30px auto}
.box h2{margin:0 0 12px}
.box label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:4px 0 14px;overflow-x:auto}
.tab{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.hbtns{display:flex;flex-direction:column;align-items:stretch;gap:6px}
#bellb{display:none;position:relative}#bellb .bell{font-size:17px}
#bellb .ntc:not(:empty){background:#fff;color:#d91616;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;font-weight:800;padding:0 5px;margin-inline-start:4px;display:inline-block}
#bellb.has{border-color:#ff4a4a;background:linear-gradient(180deg,#f02a2a,#a50f0f);color:#fff}
#bellb.has .bell{display:inline-block;animation:bellr 1.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes bellr{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}}
#bellb.on{outline:2px solid #fff}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tag);border-color:var(--ink);font-weight:600}
.mute{color:var(--mute);font-size:14px}
.name{font-weight:700;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.link{background:var(--tag);border-radius:10px;padding:10px 12px;word-break:break-all;font-size:14px;margin:6px 0}
a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.stc-new{--sc:#4da3ff}.stc-contacted{--sc:#f5b942}.stc-interview{--sc:#b57bff}.stc-accepted{--sc:#2ecc71}.stc-validated{--sc:#1abc9c}.stc-hired{--sc:#ffd24d}.stc-rejected{--sc:#ff5a5a}.stc-no_answer{--sc:#9aa0a6}
.chip[class*=stc-]{border-color:color-mix(in srgb,var(--sc) 55%,transparent)}.chip[class*=stc-].on{background:color-mix(in srgb,var(--sc) 22%,transparent);border-color:var(--sc)}
.badge[class*=stc-]{background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc);border:1px solid color-mix(in srgb,var(--sc) 55%,transparent);font-weight:600}
.rc-owner{--sc:#ffd24d}.rc-admin{--sc:#ff8a3d}.rc-unit_manager{--sc:#b57bff}.rc-team_leader{--sc:#4da3ff}.rc-senior_recruiter{--sc:#f5b942}.rc-recruiter{--sc:#2ecc71}
.chip[class*=rc-]{border-color:color-mix(in srgb,var(--sc) 55%,transparent)}.chip[class*=rc-].on{background:color-mix(in srgb,var(--sc) 22%,transparent);border-color:var(--sc)}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--sc);background:color-mix(in srgb,var(--sc) 18%,transparent);border:2px solid var(--sc);flex:none}
.mcard{border-left:3px solid var(--sc)!important}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--tag)}
.badge{display:inline-block;background:var(--tag);border-radius:6px;padding:1px 8px;font-size:13px}
.sep{height:1px;background:var(--line);margin:10px 0}
/* Apex red/black/silver */
body::before{content:"";display:block;height:5px;background:linear-gradient(90deg,#7a0a0a,#ff2a2a 40%,#c4c8cc 70%,#7a0a0a)}
header{border-bottom:2px solid var(--acc);margin-bottom:6px}
.logo{height:56px;border:1px solid #8a8f94;box-shadow:0 0 18px rgba(217,22,22,.45)}
.emo{font-size:22px;letter-spacing:2px;filter:drop-shadow(0 0 6px rgba(217,22,22,.7));white-space:nowrap}
.card{border-left:3px solid var(--acc);background:linear-gradient(180deg,#1a1415,#111113)}
.tag{background:#2a1214;border:1px solid #5a1c1f;color:#f0d6d6}
h1{background:linear-gradient(90deg,#fff,#aeb3b8 60%,#ff3b3b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand span{color:#ff2a2a}
select,input,textarea{border-color:#3a2a2c}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
.copy,.btn.pri,.sm.pri,.tab.on{background:linear-gradient(180deg,#f02a2a,#a50f0f);border-color:#ff4a4a;color:#fff;box-shadow:0 2px 10px rgba(217,22,22,.35)}
.lnk{cursor:pointer;text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px}

.bkm{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.bkb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(560px,100%);max-height:92vh;overflow:auto}
.bkb label.mute{display:block;margin-top:8px}
.bkq{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bkq.done{opacity:.5}
</style>

function renderList(){
  if(S.tab==="vr")setTimeout(autoEval,0);
  var el=$("list");if(!el)return;
  if(S.tab==="jl"){jlInit();return}
  if(S.tab==="home"){homeRender();return}
  if(S.tab==="amb"){ambRender();return}
  if(S.tab==="pri"){tpRender();if(!TP.rows&&!TP.busy)tpLoad();return}
  if(S.tab==="cl"){clRender();if(!CL.rows&&!CL.busy)clLoad();return}
  if(S.tab==="wk"){wkRender();if(!WK.data&&!WK.busy&&!WK.err)wkLoad();return}
  if(S.tab==="apps")el.innerHTML=appsHTML();else if(S.tab==="vr")el.innerHTML=voiceHTML();else if(S.tab==="pn")el.innerHTML=dailyHTML();else if(S.tab==="an")el.innerHTML=annHTML();else if(S.tab==="me")el.innerHTML=profHTML();else if(S.tab==="nt"){el.innerHTML=notifHTML();var un=S.notifs.filter(function(n){return!n.read}).map(function(n){return n.id});if(un.length)sb.from("notifications").update({read:true}).in("id",un).then(function(){S.notifs.forEach(function(n){n.read=true});setNtCount()})}else if(S.tab==="team")el.innerHTML=teamHTML();else el.innerHTML=invHTML();
  applyGQ();
}
function applyGQ(){
  var el=$("list");if(!el||!(S.tab==="vr"||S.tab==="nt"||S.tab==="inv"))return;
  var q=(S.gq||"").trim().toLowerCase();
  Array.prototype.forEach.call(el.children,function(c){if(!c.classList.contains("card")||c.querySelector("#ir"))return;c.style.display=(!q||c.textContent.toLowerCase().indexOf(q)>-1)?"":"none"});
}

/* voice download as MP3 (converted in the browser) */
function loadLame(){return new Promise(function(res,rej){if(window.lamejs)return res();var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function dlMp3(url,name){
  try{
    toast(lang==="ar"?"بجهّز ملف MP3…":"Preparing MP3…");
    await loadLame();
    var buf=await (await fetch(url)).arrayBuffer();
    var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
    var au=await new Promise(function(r,j){ctx.decodeAudioData(buf,r,j)});
    var sr=au.sampleRate,ch=Math.min(au.numberOfChannels,2),enc=new lamejs.Mp3Encoder(ch,sr,96),parts=[],bs=1152;
    function i16(f){var o=new Int16Array(f.length);for(var i=0;i<f.length;i++){var v=Math.max(-1,Math.min(1,f[i]));o[i]=v<0?v*32768:v*32767}return o}
    var L=i16(au.getChannelData(0)),R=ch>1?i16(au.getChannelData(1)):null;
    for(var i=0;i<L.length;i+=bs){var d=ch>1?enc.encodeBuffer(L.subarray(i,i+bs),R.subarray(i,i+bs)):enc.encodeBuffer(L.subarray(i,i+bs));if(d.length)parts.push(d)}
    var e=enc.flush();if(e.length)parts.push(e);
    try{ctx.close()}catch(_){}
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(parts,{type:"audio/mpeg"}));
    a.download=String(name||"voice").replace(/[\\/:*?"<>|]+/g,"_")+".mp3";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    return true;
  }catch(err){toast(lang==="ar"?"مقدرتش أحوّل لـ MP3، هنزّل الأصلي":"MP3 conversion failed, downloading original");return false}
}

document.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="ir"){fillParents();return}
  if(t.dataset.role||t.dataset.par){

    var nr=t.dataset.role?t.value:pr.role,np=t.dataset.par?t.value:pr.parent_id,ar=lang==="ar";
    var kids=S.team.filter(function(x){return x.parent_id===pid&&RANK[x.role]<=RANK[nr]});
    if(kids.length){toast(ar?"الشخص ده تحته ناس، انقلهم الأول":"This person has people under them, move them first");renderList();return}
    var par=S.team.find(function(x){return x.id===np});
    if(!par||RANK[par.role]>=RANK[nr]){np=S.me.id}
    var rr=await sb.rpc("change_role",{p_id:pid,p_role:nr,p_parent:np});
    if(rr.error)toast(rr.error.message);else{pr.role=nr;pr.parent_id=np;toast(T("saved"))}
    renderList();return;
  }
  if(t.id==="ac_p"){var dd=$("ac_dup");if(dd){dd.textContent="";if(t.value.replace(/\D/g,"").length>=8){try{var dr0=await sb.rpc("check_duplicate",{p_phone:t.value});if(dr0.data&&dr0.data.length){var x0=dr0.data[0];dd.textContent=(lang==="ar"?"⚠️ الرقم ده موجود: ":"⚠️ Already exists: ")+x0.full_name+(x0.recruiter_name?" ("+x0.recruiter_name+")":"")+" · "+stl(x0.status)}}catch(x){}}}return}
  if(t.id==="sf_sel"){var sf=(S.sf||[]).find(function(x){return x.id===t.value});if(sf){S.filter=sf.filter.f||"";S.q=sf.filter.q||"";S.fday=sf.filter.d||"";renderList()}return}
  if(t.id==="sf_day"){S.fday=t.value;renderList();return}
  if(t.dataset.fu){if(await upd(t.dataset.fu,{followup_at:t.value?new Date(t.value).toISOString():null}))toast(T("saved"));return}
  if(t.dataset.st){if(await upd(t.dataset.st,{status:t.value})){renderList();if(S.cand){render();loadNotes(S.cand)}}}
  else if(t.dataset.rc){if(await upd(t.dataset.rc,{recruiter_id:t.value||null})){toast(T("saved"));if(S.cand)render()}}

  else if(t.dataset.nt){if(await upd(t.dataset.nt,{notes:t.value}))toast(T("saved"))}
});
