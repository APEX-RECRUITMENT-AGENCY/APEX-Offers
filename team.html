<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Apex Team</title>
<style>
:root{--bg:#d8dbdd;--card:#eceeef;--ink:#0b0b0c;--mute:#55595d;--line:#b9bec2;--acc:#0b0b0c;--acc-ink:#e6e8ea;--tag:#c6cacd;--hl:#fff;--bad:#b3261e;--ok:#1b7a3c}
@media (prefers-color-scheme:dark){:root{--bg:#09090a;--card:#151517;--ink:#e3e5e7;--mute:#9a9ea3;--line:#2a2c2f;--acc:#c4c8cc;--acc-ink:#09090a;--tag:#232528;--hl:#fff;--bad:#ff8a80;--ok:#6fd08c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 60px}
header{display:flex;align-items:center;gap:8px;padding:18px 0}
.brand{font-weight:800;font-size:20px;flex:1}
button,select,input,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
.btn{border:1px solid var(--ink);background:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:14px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.box{max-width:420px;margin:30px auto}
.box h2{margin:0 0 12px}
.box label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:4px 0 14px;overflow-x:auto}
.tab{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tag);border-color:var(--ink);font-weight:600}
.mute{color:var(--mute);font-size:14px}
.name{font-weight:700;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.link{background:var(--tag);border-radius:10px;padding:10px 12px;word-break:break-all;font-size:14px;margin:6px 0}
a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.badge{display:inline-block;background:var(--tag);border-radius:6px;padding:1px 8px;font-size:13px}
.sep{height:1px;background:var(--line);margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">APEX · <span id="ttl"></span></div><button class="btn sm" id="lg"></button><button class="btn sm" id="out" style="display:none"></button></header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var CFG=window.APEX_CONFIG||{},sb=null;
try{if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){}
var I={
en:{title:"Team",login:"Log in",signup:"Sign up",email:"Email",password:"Password",name:"Full name",code:"Invite code",ownerHint:"Leave the code empty only if you are the first account (the owner).",finish:"Finish setup",logout:"Log out",lang:"العربية",
cand:"Candidates",team:"Team",invites:"Invites",search:"Search name, phone or job",all:"All",none:"No candidates yet.",notes:"Notes",saved:"Saved",copy:"Copy",copied:"Copied",myLink:"Your referral link (candidates who apply through it are yours)",assign:"Recruiter",unassigned:"Unassigned",
newInvite:"New invite",role:"Role",reportsTo:"Reports to",create:"Create code",unused:"Unused",used:"Used",link:"Registration link",active:"Active",disabled:"Disabled",disable:"Disable",enable:"Enable",call:"Call",wa:"WhatsApp",count:"candidates",
confirm:"Account created. Open the confirmation email, then log in.",badCode:"Invalid or already used code.",ownerExists:"An owner already exists. Enter an invite code.",already:"This account is already set up or disabled. Contact the owner.",noCfg:"The system is not connected yet. Fill in config.js.",
age:"Age",grad:"Graduation",eng:"English",job:"Job",del:"Delete",
st:{new:"New",contacted:"Contacted",interview:"Interview",accepted:"Accepted",hired:"Hired",rejected:"Rejected",no_answer:"No answer"},
ro:{owner:"Owner",unit_manager:"Unit Manager",team_leader:"Team Leader",recruiter:"Recruiter"}},
ar:{title:"الفريق",login:"دخول",signup:"حساب جديد",email:"الإيميل",password:"كلمة السر",name:"الاسم بالكامل",code:"كود الدعوة",ownerHint:"سيب الكود فاضي فقط لو انت أول حساب (المالك).",finish:"إنهاء التسجيل",logout:"خروج",lang:"English",
cand:"المرشحين",team:"الفريق",invites:"الدعوات",search:"ابحث بالاسم أو الرقم أو الوظيفة",all:"الكل",none:"مفيش مرشحين لسه.",notes:"ملاحظات",saved:"اتحفظ",copy:"نسخ",copied:"اتنسخ",myLink:"لينكك الخاص (المرشحين اللي يقدموا منه بيتسجلوا ليك)",assign:"الريكروتر",unassigned:"غير معيّن",
newInvite:"دعوة جديدة",role:"الوظيفة",reportsTo:"يتبع",create:"إنشاء كود",unused:"غير مستخدم",used:"مستخدم",link:"لينك التسجيل",active:"شغال",disabled:"موقوف",disable:"إيقاف",enable:"تشغيل",call:"اتصال",wa:"واتساب",count:"مرشح",
confirm:"اتعمل الحساب. افتح إيميل التأكيد وبعدها سجّل دخول.",badCode:"الكود غلط أو اتستخدم قبل كده.",ownerExists:"المالك موجود بالفعل. اكتب كود الدعوة.",already:"الحساب ده متسجل بالفعل أو موقوف. كلّم المالك.",noCfg:"النظام لسه مش متوصل. املا ملف config.js.",
age:"السن",grad:"التخرج",eng:"الإنجليزي",job:"الوظيفة",del:"حذف",
st:{new:"جديد",contacted:"تم التواصل",interview:"انترفيو",accepted:"مقبول",hired:"اتعيّن",rejected:"مرفوض",no_answer:"مردش"},
ro:{owner:"المالك",unit_manager:"يونيت مانجر",team_leader:"تيم ليدر",recruiter:"ريكروتر"}}};
var lang="ar";try{lang=localStorage.getItem("apexLang")||"ar"}catch(e){}
function T(k){return(I[lang][k]!=null?I[lang][k]:I.en[k])||k}
var ST=["new","contacted","interview","accepted","hired","rejected","no_answer"];
var RANK={owner:0,unit_manager:1,team_leader:2,recruiter:3};
var INV={owner:["unit_manager","team_leader","recruiter"],unit_manager:["team_leader","recruiter"],team_leader:["recruiter"],recruiter:[]};
var S={session:null,me:null,team:[],apps:[],invites:[],tab:"apps",filter:"",q:"",msg:""};
var urlCode=(new URLSearchParams(location.search).get("code")||"").toUpperCase();
var $=function(i){return document.getElementById(i)};
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2200)}
function base(){return new URL("./",location.href).href}
function copy(s){function ok(){toast(T("copied"))}function fb(){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok,fb);else fb()}
function errMsg(e){var m=(e&&e.message)||"";if(/invalid code/.test(m))return T("badCode");if(/owner exists/.test(m))return T("ownerExists");if(/already registered/.test(m))return T("already");return m||"Error"}
function nameOf(id){var p=S.team.find(function(x){return x.id===id});return p?p.full_name:""}
function waNum(p){var d=String(p||"").replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);else if(d.charAt(0)==="0")d="20"+d.slice(1);return d}
function fmt(d){try{return new Date(d).toLocaleString(lang==="ar"?"ar-EG":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return d}}

async function boot(){
  if(!sb){render();return}
  var r=await sb.auth.getSession();S.session=r.data.session;S.me=null;
  if(S.session){
    var p=await sb.from("profiles").select("*").eq("id",S.session.user.id).maybeSingle();
    S.me=p.data;if(S.me)await loadData();
  }
  render();
}
async function loadData(){
  var a=await Promise.all([
    sb.from("profiles").select("*").order("created_at"),
    sb.from("applications").select("*").order("created_at",{ascending:false}).limit(1000),
    INV[S.me.role].length?sb.from("invite_codes").select("*").order("created_at",{ascending:false}).limit(200):Promise.resolve({data:[]})]);
  S.team=a[0].data||[];S.apps=a[1].data||[];S.invites=a[2].data||[];
}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("ttl").textContent=T("title");$("lg").textContent=T("lang");$("out").textContent=T("logout");
  $("out").style.display=S.session?"":"none";
  var h="";
  if(!sb)h='<div class="card bad">'+T("noCfg")+'</div>';
  else if(!S.session)h=authView();
  else if(!S.me)h=completeView();
  else h=appView();
  $("app").innerHTML=h;
  if(S.me)renderList();
}
function authView(){
  return '<div class="card box"><h2>'+T("login")+'</h2>'+(urlCode?'<p class="ok">'+T("code")+': <b>'+esc(urlCode)+'</b></p>':'')+
  '<label>'+T("email")+'</label><input id="em" type="email" autocomplete="email" dir="ltr">'+
  '<label>'+T("password")+'</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">'+
  (S.msg?'<p class="ok">'+esc(S.msg)+'</p>':'')+
  '<div class="row" style="margin-top:14px"><button class="btn pri" data-act="login">'+T("login")+'</button><button class="btn" data-act="signup">'+T("signup")+'</button></div></div>';
}
function completeView(){
  return '<div class="card box"><h2>'+T("finish")+'</h2><label>'+T("name")+'</label><input id="nm">'+
  '<label>'+T("code")+'</label><input id="cd" dir="ltr" value="'+esc(urlCode)+'"><p class="mute">'+T("ownerHint")+'</p>'+
  '<button class="btn pri" data-act="finish">'+T("finish")+'</button></div>';
}
function appView(){
  var me=S.me,h='<div class="card"><div class="name">'+esc(me.full_name)+' <span class="badge">'+T("ro")[me.role]+'</span></div>'+
  '<p class="mute" style="margin:8px 0 2px">'+T("myLink")+'</p><div class="link" dir="ltr">'+esc(base()+"index.html?ref="+me.ref_code)+'</div>'+
  '<button class="btn sm" data-act="copylink">'+T("copy")+'</button></div>';
  h+='<div class="tabs"><button class="tab'+(S.tab==="apps"?" on":"")+'" data-tab="apps">'+T("cand")+' ('+S.apps.length+')</button>'+
  '<button class="tab'+(S.tab==="team"?" on":"")+'" data-tab="team">'+T("team")+' ('+S.team.length+')</button>'+
  (INV[me.role].length?'<button class="tab'+(S.tab==="inv"?" on":"")+'" data-tab="inv">'+T("invites")+'</button>':'')+'</div>';
  h+='<div id="list"></div>';return h;
}
function renderList(){
  var el=$("list");if(!el)return;
  if(S.tab==="apps")el.innerHTML=appsHTML();else if(S.tab==="team")el.innerHTML=teamHTML();else el.innerHTML=invHTML();
}
function ivVal(v){if(!v)return"";var d=new Date(v);if(isNaN(d))return"";var z=function(n){return("0"+n).slice(-2)};return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())}
function appsHTML(){
  var cnt={};S.apps.forEach(function(a){cnt[a.status]=(cnt[a.status]||0)+1});
  var h='<input id="q" placeholder="'+esc(T("search"))+'" value="'+esc(S.q)+'" style="margin-bottom:10px"><div class="chips"><button class="chip'+(S.filter===""?" on":"")+'" data-f="">'+T("all")+' '+S.apps.length+'</button>';
  ST.forEach(function(s){h+='<button class="chip'+(S.filter===s?" on":"")+'" data-f="'+s+'">'+T("st")[s]+' '+(cnt[s]||0)+'</button>'});
  h+='</div>';
  var q=S.q.toLowerCase(),list=S.apps.filter(function(a){return(!S.filter||a.status===S.filter)&&(!q||(a.full_name+" "+a.phone+" "+a.job_company+" "+a.job_title).toLowerCase().indexOf(q)>-1)});
  if(!list.length)return h+'<p class="mute">'+T("none")+'</p>';
  var owner=S.me.role==="owner";
  list.forEach(function(a){
    h+='<div class="card" data-id="'+a.id+'"><div class="row"><span class="name" style="flex:1">'+esc(a.full_name)+'</span><span class="mute">'+fmt(a.created_at)+'</span></div>'+
    '<div class="mute">'+esc(a.job_company||"")+' · '+esc(a.job_title||"")+'</div>'+
    '<div class="row" style="margin:8px 0"><a class="btn sm" href="tel:'+esc(a.phone)+'" dir="ltr">'+T("call")+' '+esc(a.phone)+'</a><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+waNum(a.phone)+'">'+T("wa")+'</a></div>'+
    (a.email?'<div class="mute" dir="ltr" style="text-align:start">'+esc(a.email)+'</div>':'')+(a.experience?'<div class="mute" style="margin-top:4px">'+(lang==="ar"?"الخبرة: ":"Experience: ")+esc(a.experience)+'</div>':'')+
    (a.voice_path?'<div class="row" style="margin:8px 0" id="v_'+a.id+'"><button class="btn sm" data-voice="'+esc(a.voice_path)+'" data-vid="'+a.id+'">&#127908; '+(lang==="ar"?"فويس نوت":"Voice note")+(a.voice_secs?" ("+a.voice_secs+"s)":"")+'</button></div>':'')+
    '<div class="mute">'+(a.age?T("age")+": "+a.age+" · ":"")+(a.graduation?T("grad")+": "+esc(a.graduation)+" · ":"")+(a.english_level?T("eng")+": "+esc(a.english_level):"")+'</div>'+
    '<div class="grid2"><select data-st="'+a.id+'">'+ST.map(function(s){return'<option value="'+s+'"'+(a.status===s?" selected":"")+'>'+T("st")[s]+'</option>'}).join("")+'</select>'+
    (owner?'<select data-rc="'+a.id+'"><option value="">'+T("unassigned")+'</option>'+S.team.map(function(p){return'<option value="'+p.id+'"'+(a.recruiter_id===p.id?" selected":"")+'>'+esc(p.full_name)+'</option>'}).join("")+'</select>':'<div class="mute">'+T("assign")+': '+esc(nameOf(a.recruiter_id))+'</div>')+'</div>'+
    (owner?'<div style="margin-top:8px"><button class="btn sm" data-del="'+a.id+'" style="color:#ff6b6b">&#128465; '+(lang==="ar"?"مسح المرشح":"Delete candidate")+'</button></div>':'')+
    '<label class="mute" style="display:block;margin-top:8px">'+(lang==="ar"?"موعد الإنترفيو":"Interview date")+'</label><input type="datetime-local" data-iv="'+a.id+'" value="'+ivVal(a.interview_at)+'" dir="ltr" style="width:100%">'+
    '<textarea data-nt="'+a.id+'" placeholder="'+T("notes")+'" style="margin-top:8px">'+esc(a.notes||"")+'</textarea></div>';
  });
  return h;
}
function teamHTML(){
  var h="",owner=S.me.role==="owner";
  S.team.slice().sort(function(a,b){return RANK[a.role]-RANK[b.role]}).forEach(function(p){
    var n=S.apps.filter(function(a){return a.recruiter_id===p.id}).length;
    h+='<div class="card"><div class="row"><span class="name" style="flex:1">'+esc(p.full_name)+'</span><span class="badge">'+T("ro")[p.role]+'</span></div>'+
    '<div class="mute">'+(p.parent_id?T("reportsTo")+": "+esc(nameOf(p.parent_id))+" · ":"")+n+" "+T("count")+" · "+(p.active?'<span class="ok">'+T("active")+'</span>':'<span class="bad">'+T("disabled")+'</span>')+'</div>'+
    ((owner&&p.role!=="owner"||S.me.role==="unit_manager"&&RANK[p.role]>1)?'<div class="grid2" style="margin-top:8px"><div><label class="mute">'+(lang==="ar"?"الدور":"Role")+'</label><select data-role="'+p.id+'">'+(owner?["unit_manager","team_leader","recruiter"]:["team_leader","recruiter"]).map(function(r){return'<option value="'+r+'"'+(p.role===r?" selected":"")+'>'+T("ro")[r]+'</option>'}).join("")+'</select></div><div><label class="mute">'+T("reportsTo")+'</label><select data-par="'+p.id+'">'+S.team.filter(function(x){return x.id!==p.id&&RANK[x.role]<RANK[p.role]}).map(function(x){return'<option value="'+x.id+'"'+(p.parent_id===x.id?" selected":"")+'>'+esc(x.full_name)+' ('+T("ro")[x.role]+')</option>'}).join("")+'</select></div></div>':'')+
    '<div class="row" style="margin-top:8px"><button class="btn sm" data-copy="'+esc(base()+"index.html?ref="+p.ref_code)+'">'+T("copy")+' '+T("myLink").split(" (")[0]+'</button>'+
    (owner&&p.role!=="owner"?'<button class="btn sm" data-toggle="'+p.id+'">'+(p.active?T("disable"):T("enable"))+'</button>':'')+'</div></div>';
  });
  return h;
}
function invHTML(){
  var me=S.me,roles=INV[me.role];
  var h='<div class="card"><div class="name">'+T("newInvite")+'</div><div class="grid2"><div><label class="mute">'+T("role")+'</label><select id="ir">'+roles.map(function(r){return'<option value="'+r+'">'+T("ro")[r]+'</option>'}).join("")+'</select></div>'+
  '<div><label class="mute">'+T("reportsTo")+'</label><select id="ip"></select></div></div><button class="btn pri" style="margin-top:12px" data-act="mkinvite">'+T("create")+'</button></div>';
  S.invites.forEach(function(v){
    var lk=base()+"team.html?code="+v.code;
    h+='<div class="card"><div class="row"><b dir="ltr" style="flex:1">'+esc(v.code)+'</b><span class="badge">'+T("ro")[v.role]+'</span><span class="'+(v.used_by?"mute":"ok")+'">'+(v.used_by?T("used")+": "+esc(nameOf(v.used_by)):T("unused"))+'</span></div>'+
    '<div class="mute">'+T("reportsTo")+': '+esc(nameOf(v.parent_id))+'</div>'+(v.used_by?'':'<div class="link" dir="ltr">'+esc(lk)+'</div><button class="btn sm" data-copy="'+esc(lk)+'">'+T("copy")+'</button>')+'</div>';
  });
  setTimeout(fillParents,0);return h;
}
function fillParents(){
  var r=$("ir"),p=$("ip");if(!r||!p)return;
  var rank=RANK[r.value];
  p.innerHTML=S.team.filter(function(x){return x.active&&RANK[x.role]<rank}).map(function(x){return'<option value="'+x.id+'"'+(x.id===S.me.id?" selected":"")+'>'+esc(x.full_name)+' ('+T("ro")[x.role]+')</option>'}).join("");
}
async function upd(id,patch){
  var r=await sb.from("applications").update(patch).eq("id",id).select().single();
  if(r.error){toast(r.error.message);return false}
  var i=S.apps.findIndex(function(x){return x.id===id});if(i>-1)S.apps[i]=r.data;return true;
}
document.addEventListener("click",async function(e){
  var b=e.target.closest("[data-act],[data-tab],[data-f],[data-copy],[data-toggle],[data-voice],[data-del]");if(!b)return;
  if(b.dataset.del){var da=S.apps.find(function(x){return x.id===b.dataset.del});if(!da||!confirm(lang==="ar"?"متأكد إنك عايز تمسح "+da.full_name+"؟ ده مش بيتراجع عنه.":"Delete "+da.full_name+"? This cannot be undone."))return;var dr=await sb.from("applications").delete().eq("id",da.id).select();if(dr.error||!dr.data||!dr.data.length){toast(dr.error?dr.error.message:"Not allowed");return}if(da.voice_path)await sb.storage.from("voice").remove([da.voice_path]);S.apps=S.apps.filter(function(x){return x.id!==da.id});render();toast(lang==="ar"?"اتمسح":"Deleted");return}
  if(b.dataset.per){S.per=b.dataset.per;renderList();return}
  if(b.dataset.voice){var vs=await sb.storage.from("voice").createSignedUrl(b.dataset.voice,3600);if(vs.error){toast(vs.error.message);return}var box=document.getElementById("v_"+b.dataset.vid);box.innerHTML='<audio controls autoplay preload="auto" style="width:100%" src="'+vs.data.signedUrl+'"></audio>';return}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();return}
  if(b.dataset.f!==undefined&&b.classList.contains("chip")){S.filter=b.dataset.f;renderList();return}
  if(b.dataset.copy){copy(b.dataset.copy);return}
  if(b.dataset.toggle){var p=S.team.find(function(x){return x.id===b.dataset.toggle});var r=await sb.from("profiles").update({active:!p.active}).eq("id",p.id);if(r.error)toast(r.error.message);else{p.active=!p.active;renderList()}return}
  var a=b.dataset.act;
  if(a==="copylink")copy(base()+"index.html?ref="+S.me.ref_code);
  else if(a==="login"){var r1=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(r1.error)toast(r1.error.message);else boot()}
  else if(a==="signup"){var r2=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});if(r2.error)toast(r2.error.message);else if(!r2.data.session){S.msg=T("confirm");render()}else boot()}
  else if(a==="finish"){
    var nm=$("nm").value.trim(),cd=$("cd").value.trim();if(nm.length<2){toast(T("name"));return}
    var r3=cd?await sb.rpc("redeem_invite",{p_code:cd,p_name:nm}):await sb.rpc("claim_owner",{p_name:nm});
    if(r3.error)toast(errMsg(r3.error));else boot();
  }
  else if(a==="mkinvite"){
    var role=$("ir").value,par=$("ip").value;if(!par)return;
    var r4=await sb.from("invite_codes").insert({role:role,parent_id:par,created_by:S.me.id}).select().single();
    if(r4.error)toast(r4.error.message);else{S.invites.unshift(r4.data);renderList()}
  }
});
document.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="ir"){fillParents();return}
  if(t.dataset.role||t.dataset.par){
    var pid=t.dataset.role||t.dataset.par,pr=S.team.find(function(x){return x.id===pid}),patch={};
    var nr=t.dataset.role?t.value:pr.role,np=t.dataset.par?t.value:pr.parent_id,ar=lang==="ar";
    var kids=S.team.filter(function(x){return x.parent_id===pid&&RANK[x.role]<=RANK[nr]});
    if(kids.length){toast(ar?"الشخص ده تحته ناس، انقلهم الأول":"This person has people under them, move them first");renderList();return}
    var par=S.team.find(function(x){return x.id===np});
    if(!par||RANK[par.role]>=RANK[nr]){np=S.me.id}
    var rr=await sb.rpc("change_role",{p_id:pid,p_role:nr,p_parent:np});
    if(rr.error)toast(rr.error.message);else{pr.role=nr;pr.parent_id=np;toast(T("saved"))}
    renderList();return;
  }
  if(t.dataset.st){if(await upd(t.dataset.st,{status:t.value}))renderList()}
  else if(t.dataset.rc){if(await upd(t.dataset.rc,{recruiter_id:t.value||null}))toast(T("saved"))}
  else if(t.dataset.iv){if(await upd(t.dataset.iv,{interview_at:t.value?new Date(t.value).toISOString():null}))toast(T("saved"))}
  else if(t.dataset.nt){if(await upd(t.dataset.nt,{notes:t.value}))toast(T("saved"))}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var el=$("list"),pos=e.target.selectionStart;renderList();var q=$("q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}});
$("lg").onclick=function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("apexLang",lang)}catch(e){}render()};
$("out").onclick=async function(){await sb.auth.signOut();S.session=null;S.me=null;render()};
if(sb)sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"){S.session=null;S.me=null;render()}});
boot();
</script>
</body>
</html>
